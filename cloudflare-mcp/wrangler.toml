name = "scrapling-mcp"
main = "src/index.ts"
compatibility_date = "2026-10-10"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true

[vars]
APP_NAME = "Scrapling MCP"
PUBLIC_ORIGIN = "https://scrapling-mcp.derrickserna-ca.workers.dev"
BACKEND_MCP_URL = "https://scrapling-gateway.derrickserna.com/mcp"
ALLOWED_GITHUB_USERS = "derrick-ships"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "cb722d819dee4c8c9873b639e542011a"

# Secrets: GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, BACKEND_AUTH_TOKEN.
# No Workers AI, paid services, Durable Objects, or app database.
[observability]
enabled = false

[dev]
port = 8788

