name = "scrapling-mcp"
main = "src/index.ts"
compatibility_date = "2026-10-10"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true

[vars]
APP_NAME = "Scrapling MCP"
# Replace with the workers.dev hostname assigned to your account.
PUBLIC_ORIGIN = "https://scrapling-mcp.your-subdomain.workers.dev"
BACKEND_MCP_URL = "https://scrapling.derrickserna.com/mcp"
ALLOWED_GITHUB_USERS = "derrick-ships"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets: GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, BACKEND_AUTH_TOKEN.
# No Workers AI, paid services, Durable Objects, or app database.
[observability]
enabled = false

[dev]
port = 8788
