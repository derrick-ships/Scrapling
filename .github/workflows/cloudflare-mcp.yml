name: Cloudflare MCP checks

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-mcp/**'
      - '.github/workflows/cloudflare-mcp.yml'
  pull_request:
    paths:
      - 'cloudflare-mcp/**'
      - '.github/workflows/cloudflare-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-mcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-mcp
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare-mcp/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run type-check
      - name: Test OAuth and MCP flows
        run: npm test
      - name: Build Worker without deploying
        run: npx wrangler deploy --dry-run --outdir dist
        env:
          WRANGLER_SEND_METRICS: 'false'
